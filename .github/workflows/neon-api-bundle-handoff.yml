name: Temporary Neon API bundle handoff
on:
  push:
    branches: ['feature/technician-mobile-navigation-followups']
    paths: ['functions/api/**','src/types/**','src/helpers/**','.github/workflows/neon-api-bundle-handoff.yml']
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false @neon/config-runtime@1.7.3
      - name: Prepare compact, secret-free Neon API deployment ZIP
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { buildFunctionBundle } from '@neon/config-runtime/v1'
          const zip = await buildFunctionBundle({ slug: 'api', source: './functions/api/index.ts' })
          const base64 = Buffer.from(zip).toString('base64')
          console.log('NEON_ZIP_BYTES:' + zip.byteLength)
          console.log('NEON_ZIP_SHA256:' + (await import('node:crypto')).createHash('sha256').update(zip).digest('hex'))
          for (let index = 0; index < base64.length; index += 12000) {
            console.log('NEON_ZIP_PART:' + base64.slice(index, index + 12000))
          }
          NODE
