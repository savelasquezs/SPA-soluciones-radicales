name: Check Neon deploy credential
on:
  push:
    branches: [chore/neon-compact-api-deploy]
    paths: ['.github/workflows/check-neon-credential.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      HAS_NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      HAS_NEON_TOKEN: ${{ secrets.NEON_TOKEN }}
      HAS_NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
    steps:
      - name: Check availability without printing secrets
        shell: bash
        run: |
          for name in HAS_NEON_API_KEY HAS_NEON_TOKEN HAS_NEON_API_TOKEN; do
            if test -n "${!name}"; then
              echo "$name=available"
            else
              echo "$name=not-configured"
            fi
          done
