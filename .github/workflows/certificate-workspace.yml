name: Certificate implementation workspace
on:
  push:
    branches: [feature/certificate-templates]
    paths: ['.github/workflows/certificate-workspace.yml']
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --save-exact docxtemplater pizzip @xmldom/xmldom
      - name: Package isolated dependencies for validation
        run: |
          cp "$(command -v node)" /tmp/node24
          tar -czf /tmp/certificate-dependencies.tar.gz node_modules package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: certificate-dependencies
          path: |
            /tmp/certificate-dependencies.tar.gz
            /tmp/node24
          retention-days: 1
