name: Temporary npm audit
on:
  push:
    branches: [feature/certificate-templates]
    paths: ['.github/workflows/npm-audit-temp.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --json > audit.json || true
      - run: cat audit.json
