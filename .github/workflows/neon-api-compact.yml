name: Bundle compressed Neon API for deployment
on:
  push:
    branches: [chore/neon-compact-api-deploy]
    paths: ['.github/workflows/neon-api-compact.yml']
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build ARM64 runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --legacy-peer-deps esbuild@0.28.2
          mkdir -p .neon-compact
          node --input-type=module <<'NODE'
          import { build } from 'esbuild'
          await build({
            entryPoints: ['functions/api/index.ts'],
            outfile: '.neon-compact/index.mjs',
            bundle: true,
            external: ['sharp'],
            platform: 'node',
            target: 'node24',
            format: 'esm',
            conditions: ['node'],
            banner: { js: 'import { createRequire as __createRequire } from "node:module"; const require = __createRequire(import.meta.url);' },
          })
          NODE
          node --check .neon-compact/index.mjs
          npm install --no-save --package-lock=false --ignore-scripts --prefix .neon-compact --os=linux --cpu=arm64 --libc=glibc sharp@0.34.5
          find .neon-compact/node_modules -type f \( -name '*.d.ts' -o -name '*.md' -o -name '*.map' \) -delete
          rm -rf .neon-compact/node_modules/sharp/src
          tar --format=ustar --dereference -cf .neon-compact/payload.tar -C .neon-compact index.mjs node_modules
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { brotliCompressSync, constants } from 'node:zlib'
          const input = readFileSync('.neon-compact/payload.tar')
          const compressed = brotliCompressSync(input, { params: { [constants.BROTLI_PARAM_QUALITY]: 11 } })
          writeFileSync('.neon-compact/payload.tar.br', compressed)
          console.log('Payload compressed:', input.length, '->', compressed.length)
          NODE
          mkdir -p .neon-boot
          cp scripts/neon/runtime-loader.mjs .neon-boot/index.mjs
          mv .neon-compact/payload.tar.br .neon-boot/payload.tar.br
          node --check .neon-boot/index.mjs
      - uses: docker/setup-qemu-action@v3
      - name: Validate native Sharp ARM64 with exact deployed loader
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 -e SR_NEON_NATIVE_SMOKE=1 -v "$PWD/.neon-boot:/bundle:ro" node:24-bookworm-slim node /bundle/index.mjs
      - name: Package and publish only if safely under connector size limit
        shell: bash
        run: |
          set -euo pipefail
          cd .neon-boot
          zip -0 -q neon-api.zip index.mjs payload.tar.br
          ls -lh neon-api.zip
          sha256sum neon-api.zip
          base64 -w0 neon-api.zip > neon-api.zip.b64
          size=$(wc -c < neon-api.zip.b64)
          echo "Base64 bytes: $size"
          if test "$size" -gt 9600000; then
            echo "Compressed bundle still too large. No deployment artifact committed."
            exit 1
          fi
          mkdir -p ../.github/compact-generated
          fold -w 700000 neon-api.zip.b64 | awk '{print > sprintf("../.github/compact-generated/neon-api.zip.b64.%03d", NR)}'
          cd ..
          git config user.name "sr-neon-compact-bundle"
          git config user.email "sr-neon-compact-bundle@users.noreply.github.com"
          git add .github/compact-generated
          git commit -m "build: temporary Brotli Neon API deploy bundle"
          git push origin HEAD:chore/neon-compact-api-deploy
