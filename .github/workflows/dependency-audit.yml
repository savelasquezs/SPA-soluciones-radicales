name: Dependency audit
on:
  push:
    branches: [feature/certificate-templates]
    paths: ['.github/workflows/dependency-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: npm audit
        run: npm audit --json > npm-audit.json || true
      - name: summary
        run: |
          node -e "const a=require('./npm-audit.json'); console.log(JSON.stringify(a.vulnerabilities ?? {}, null, 2)); console.log('META', JSON.stringify(a.metadata ?? {}, null, 2));"
