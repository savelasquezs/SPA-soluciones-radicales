name: Retention worker verification
on:
  push:
    branches: [develop]
    paths:
      - 'cloudflare/storage-retention/**'
      - '.github/workflows/retention-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test cloudflare/storage-retention/index.test.mjs
