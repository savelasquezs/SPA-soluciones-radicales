name: Workspace source snapshot

on:
  push:
    branches:
      - feature/technician-area-workspace
    paths:
      - .github/workflows/workspace-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Package isolated validation dependencies
        run: tar -czf /tmp/technician-validation.tgz node_modules -C "$HOME/.cache" ms-playwright
      - uses: actions/upload-artifact@v4
        with:
          name: technician-validation-dependencies
          path: /tmp/technician-validation.tgz
          retention-days: 1
