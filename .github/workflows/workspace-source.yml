name: Workspace source snapshot

on:
  push:
    branches: [feature/technician-area-workspace]
    paths: [.github/workflows/workspace-source.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Package source and validation runtime
        run: |
          tar -czf /tmp/technician-workspace-complete.tgz .
          cp "$(command -v node)" /tmp/technician-node
      - uses: actions/upload-artifact@v4
        with:
          name: technician-workspace-complete
          path: |
            /tmp/technician-workspace-complete.tgz
            /tmp/technician-node
          retention-days: 1
