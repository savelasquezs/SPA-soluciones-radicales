name: Documentation video · bootstrap V4

on:
  push:
    branches:
      - codex/documentation-video-products-v4

permissions:
  contents: write
  id-token: write

concurrency:
  group: documentation-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      TTS_LANGUAGE_CODE: es-US
      TTS_VOICE: ${{ vars.GOOGLE_TTS_VOICE || 'es-US-Chirp3-HD-Kore' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize V4 sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip
          import pathlib
          import shutil

          mapping = {
              'e2e/documentation/mip-catalogs.docs.spec.ts': [
                  '.video-v4-bootstrap/mip-catalogs.docs.spec.ts.gz.part01',
                  '.video-v4-bootstrap/mip-catalogs.docs.spec.ts.gz.part02',
                  '.video-v4-bootstrap/mip-catalogs.docs.spec.ts.gz.part03',
                  '.video-v4-bootstrap/mip-catalogs.docs.spec.ts.gz.part04',
              ],
              'e2e/documentation/mip-catalogs.narration.json': [
                  '.video-v4-bootstrap/mip-catalogs.narration.json.gz',
              ],
              'e2e/documentation/mip-catalogs.storyboard.md': [
                  '.video-v4-bootstrap/mip-catalogs.storyboard.md.gz.part01',
                  '.video-v4-bootstrap/mip-catalogs.storyboard.md.gz.part02',
              ],
              'playwright.docs.config.ts': [
                  '.video-v4-bootstrap/playwright.docs.config.ts.gz',
              ],
              'scripts/documentation/render-video.mjs': [
                  '.video-v4-bootstrap/render-video.mjs.gz',
              ],
              '.github/workflows/documentation-video.yml': [
                  '.video-v4-bootstrap/documentation-video.final.yml.gz',
              ],
          }

          for target_name, source_names in mapping.items():
              compressed = bytearray()
              for source_name in source_names:
                  source = pathlib.Path(source_name)
                  if not source.is_file():
                      raise SystemExit(f'Falta el archivo de bootstrap: {source}')
                  compressed.extend(source.read_bytes())
              target = pathlib.Path(target_name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(gzip.decompress(bytes(compressed)))

          shutil.rmtree('.video-v4-bootstrap')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "docs: rebuild product management video v4"
          git push origin HEAD:${GITHUB_REF_NAME}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate Google Cloud configuration
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$GCP_PROJECT_ID" || { echo "::error::Falta la variable GCP_PROJECT_ID"; exit 1; }
          test -n "$WIF_PROVIDER" || { echo "::error::Falta la variable GCP_WORKLOAD_IDENTITY_PROVIDER"; exit 1; }
          test -n "$SERVICE_ACCOUNT" || { echo "::error::Falta la variable GCP_SERVICE_ACCOUNT"; exit 1; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - run: npm ci

      - name: Install media tools
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Generate Chirp 3 narration
        run: npm run docs:tts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Record 1080p interface flow
        run: npm run docs:record

      - name: Render and validate final video
        run: npm run docs:render

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-video-mip-gestion-productos-v4
          path: |
            docs-media/final/
            docs-media/audio/
            docs-media/timeline.json
            docs-media/playwright/
          if-no-files-found: warn
          retention-days: 30
