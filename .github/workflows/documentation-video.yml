name: Documentation video · Gestión de productos V4

on:
  push:
    branches:
      - codex/documentation-video-products-v4
  workflow_dispatch:
    inputs:
      voice:
        description: 'Voz femenina Chirp 3 HD'
        required: false
        default: 'es-US-Chirp3-HD-Kore'
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: documentation-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      TTS_LANGUAGE_CODE: es-US
      TTS_VOICE: ${{ inputs.voice || vars.GOOGLE_TTS_VOICE || 'es-US-Chirp3-HD-Kore' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate Google Cloud configuration
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$GCP_PROJECT_ID" || { echo "::error::Falta la variable GCP_PROJECT_ID"; exit 1; }
          test -n "$WIF_PROVIDER" || { echo "::error::Falta la variable GCP_WORKLOAD_IDENTITY_PROVIDER"; exit 1; }
          test -n "$SERVICE_ACCOUNT" || { echo "::error::Falta la variable GCP_SERVICE_ACCOUNT"; exit 1; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - run: npm ci

      - name: Install media tools
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Generate Chirp 3 narration
        run: npm run docs:tts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Record 1080p interface flow
        run: npm run docs:record

      - name: Render and validate final video
        run: npm run docs:render

      - name: Publish versioned video in the repository
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs-media/published
          cp docs-media/final/mip-gestion-productos-v4.mp4 docs-media/published/mip-gestion-productos-v4.mp4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs-media/published/mip-gestion-productos-v4.mp4
          if git diff --cached --quiet; then
            echo "El video publicado ya está actualizado."
          else
            git commit -m "docs: publish product management video v4 [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-video-mip-gestion-productos-v4
          path: |
            docs-media/final/
            docs-media/audio/
            docs-media/timeline.json
            docs-media/playwright/
          if-no-files-found: warn
          retention-days: 30
