name: File optimization checks
on:
  pull_request:
    branches: [develop]
    paths:
      - 'src/**'
      - 'functions/api/r2*'
      - 'e2e/file-optimization.spec.ts'
      - 'package*.json'
      - '*config*'
      - '.github/workflows/file-optimization.yml'
permissions:
  contents: read
concurrency:
  group: file-optimization-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_NEON_AUTH_URL: https://auth.example.test
      VITE_NEON_DATA_API_URL: https://data.example.test
      VITE_NEON_FUNCTION_URL: https://api.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit:run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/file-optimization.spec.ts --project=chromium --reporter=line
