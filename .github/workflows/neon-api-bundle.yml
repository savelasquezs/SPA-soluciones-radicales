name: Neon API bundle
on:
  pull_request:
    branches: [develop]
    paths:
      - 'functions/api/**'
      - 'package*.json'
      - '.github/workflows/neon-api-bundle.yml'
  push:
    branches: [develop]
    paths:
      - 'functions/api/**'
      - 'package*.json'
      - '.github/workflows/neon-api-bundle.yml'
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build standalone Neon API
        run: |
          mkdir -p .neon-bundle
          npx --yes esbuild@0.28.2 functions/api/index.ts --bundle --platform=node --format=esm --target=node24 --minify --legal-comments=end-of-file --banner:js="import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);" --outfile=.neon-bundle/index.mjs
          node --check .neon-bundle/index.mjs
          python3 - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('.neon-bundle/api.zip','w',ZIP_DEFLATED) as z:
              z.write('.neon-bundle/index.mjs','index.mjs')
          with ZipFile('.neon-bundle/api.zip') as z:
              assert z.namelist() == ['index.mjs']
              assert z.testzip() is None
          PY
          sha256sum .neon-bundle/api.zip
      - uses: actions/upload-artifact@v4
        with:
          name: neon-api-bundle
          path: .neon-bundle/api.zip
          retention-days: 7
          if-no-files-found: error
