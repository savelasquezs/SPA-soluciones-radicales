name: Neon API bundle
on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/neon-api-bundle.yml'
      - 'functions/**'
      - 'src/helpers/mipCatalogs.ts'
      - 'src/types/certificates.ts'
      - 'package*.json'
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Bundle Neon Function
        run: |
          mkdir -p .neon-api
          npx esbuild functions/api/index.ts \
            --bundle \
            --platform=node \
            --target=node24 \
            --format=esm \
            --banner:js="import{createRequire as ___cr}from'module';import{fileURLToPath as ___f}from'url';import{dirname as ___d}from'path';const require=___cr(import.meta.url);const __filename=___f(import.meta.url);const __dirname=___d(__filename);" \
            --outfile=.neon-api/index.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: neon-api-function
          path: .neon-api/index.mjs
          retention-days: 1
