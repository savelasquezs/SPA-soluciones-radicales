name: Prepare file optimization dependency
on:
  push:
    branches: [feature/r2-preupload-compression]
    paths: [.github/workflows/prepare-file-optimization.yml]
permissions:
  contents: write
jobs:
  dependency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r2-preupload-compression
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve and lock the PDF library
        run: npm install --save-exact --ignore-scripts pdf-lib@1.17.1
      - name: Commit only dependency files and remove this one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git rm .github/workflows/prepare-file-optimization.yml
          git commit -m 'build: pin pdf-lib for pre-upload optimization'
          git push origin HEAD:refs/heads/feature/r2-preupload-compression
