name: Temporary Neon QR-email API package
on:
  push:
    branches: [feature/report-email-html-qr-composer]
    paths: ['.github/workflows/temporary-neon-email-package.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false --legacy-peer-deps esbuild@0.28.2
      - name: Build native-free Function bundle
        run: |
          mkdir -p .neon-bundle
          node --input-type=module <<'NODE'
          import { build } from 'esbuild'
          await build({
            entryPoints: ['functions/api/index.ts'],
            outfile: '.neon-bundle/index.mjs',
            bundle: true,
            platform: 'node',
            target: 'node24',
            format: 'esm',
            conditions: ['node'],
            banner: { js: 'import { createRequire as __createRequire } from "node:module"; const require = __createRequire(import.meta.url);' },
            logLevel: 'info',
          })
          NODE
          node --check .neon-bundle/index.mjs
          cd .neon-bundle
          zip -9 -q api.zip index.mjs
          ls -lh api.zip
      - name: Transfer temporary bundle to deployment connector
        run: |
          echo SR_PACKAGE_BEGIN
          base64 -w0 .neon-bundle/api.zip | fold -w 12000 | sed 's/^/SR_PACKAGE_CHUNK:/'
          echo SR_PACKAGE_END
