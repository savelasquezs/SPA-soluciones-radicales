name: Apply technician workspace patch once
on:
  push:
    branches:
      - feature/technician-workspace-finish
    paths:
      - .github/workflows/apply-workspace-once.yml
permissions:
  contents: write
jobs:
  apply-patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and apply reviewed changes
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .workspace-transfer/workspace.patch.b64 | gzip -d > "$RUNNER_TEMP/workspace.patch"
          git apply --check "$RUNNER_TEMP/workspace.patch"
          git apply "$RUNNER_TEMP/workspace.patch"
          git rm -f .workspace-transfer/workspace.patch.b64 .github/workflows/apply-workspace-once.yml
          git add -A
          git -c user.name='ChatGPT' -c user.email='chatgpt@users.noreply.github.com' commit -m 'feat: finalizar workspace técnico con evidencias múltiples'
          git push origin HEAD:refs/heads/feature/technician-workspace-finish
