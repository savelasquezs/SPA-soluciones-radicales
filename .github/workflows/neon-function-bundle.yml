name: Temporary Neon function bundle
on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/neon-function-bundle.yml
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Bundle Neon API
        run: |
          mkdir -p neon-function
          npx -y esbuild@0.28.2 functions/api/index.ts \
            --bundle \
            --platform=node \
            --target=node24 \
            --format=esm \
            --banner:js="import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);" \
            --outfile=neon-function/index.mjs
          cd neon-function
          zip -q ../neon-function.zip index.mjs
      - name: Publish temporary deployment payload
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C ci/neon-api-bundle
          mkdir -p .deploy
          base64 -w0 neon-function.zip > .deploy/neon-function.b64
          git add .deploy/neon-function.b64
          git commit -m 'ci: temporary Neon API deployment payload'
          git push --force origin HEAD:refs/heads/ci/neon-api-bundle
